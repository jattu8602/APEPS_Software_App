name: Build All Platforms & Formats (Android, iOS, Windows, macOS, Linux, Web)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. ANDROID BUILDS (APK, App Bundle / AAB, Split-Per-ABI APKs)
  # ─────────────────────────────────────────────────────────────────────────────
  build-android:
    name: Build Android (APK, AAB & Split-ABI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Android App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Build Split-per-ABI APKs (ARM64, ARMv7, x86_64)
        run: flutter build apk --split-per-abi --release --android-skip-build-dependency-validation

      - name: Upload Universal APK
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Android-Universal-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Google Play App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Android-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload Split-per-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Android-Split-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. iOS BUILDS (iOS App Bundle & Unsigned IPA)
  # ─────────────────────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS (Runner.app & Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Bundle & IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r APEPS-iOS-unsigned.ipa Payload
          zip -r APEPS-iOS-Runner.app.zip Runner.app

      - name: Upload iOS Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-iOS-IPA
          path: build/ios/iphoneos/APEPS-iOS-unsigned.ipa

      - name: Upload iOS Runner App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-iOS-Runner-App
          path: build/ios/iphoneos/APEPS-iOS-Runner.app.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. WINDOWS DESKTOP BUILD (Standalone .EXE & Data Bundle)
  # ─────────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows Desktop (.exe)
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Compress Windows Distribution Bundle
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath APEPS-Windows.zip

      - name: Upload Windows Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Windows-Desktop
          path: APEPS-Windows.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. macOS DESKTOP BUILD (.APP Bundle)
  # ─────────────────────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS Desktop (.app)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Distribution Bundle
        run: |
          cd build/macos/Build/Products/Release
          zip -r APEPS-macOS.zip *.app

      - name: Upload macOS Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-macOS-Desktop
          path: build/macos/Build/Products/Release/APEPS-macOS.zip

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. LINUX DESKTOP BUILD (Standalone ELF Executable & Assets)
  # ─────────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux Desktop (ELF Binary)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Desktop Release
        run: flutter build linux --release

      - name: Compress Linux Distribution Bundle
        run: |
          tar -czvf APEPS-Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Standalone Package
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Linux-Desktop
          path: APEPS-Linux.tar.gz

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. WEB APPLICATION BUILD (HTML5, JS, WebAssembly & CanvasKit)
  # ─────────────────────────────────────────────────────────────────────────────
  build-web:
    name: Build Web App (HTML5 / CanvasKit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Compress Web Distribution Bundle
        run: |
          tar -czvf APEPS-Web.tar.gz -C build/web .

      - name: Upload Web Application Package
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Web-App
          path: APEPS-Web.tar.gz
