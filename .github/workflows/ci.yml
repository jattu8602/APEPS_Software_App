name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: CI / flutter (analyze, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze || echo "Flutter analyze completed with issues"
        continue-on-error: true

      - name: Run unit tests
        run: flutter test || echo "Flutter test executed"
        continue-on-error: true

      - name: Build Web Target
        run: flutter build web --release

  secret-scan:
    name: CI / secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  typo-check:
    name: CI / typo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Typo / Spell Check
        uses: codespell-project/actions-codespell@v2
        with:
          check_filenames: true
          skip: "*.json,*.lock,node_modules,.git,build"
          ignore_words_list: "ser,te,ans,nd"
        continue-on-error: true
