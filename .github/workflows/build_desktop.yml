name: Build Desktop Apps (macOS, Windows, Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Compress macOS Build
        run: |
          cd build/macos/Build/Products/Release
          zip -r APEPS-macOS.zip APEPS.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-macOS
          path: build/macos/Build/Products/Release/APEPS-macOS.zip

  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Build
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath APEPS-Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Windows
          path: APEPS-Windows.zip

  build-linux:
    name: Build Linux Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Compress Linux Build
        run: |
          tar -czvf APEPS-Linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEPS-Linux
          path: APEPS-Linux.tar.gz
